interface:
  display_name: "Design System Component"
  short_description: "Design, document, and prove reusable UI components"
  default_prompt: "Use $design-system-component only for the stage the user authorized. Produce a production-faithful prototype and source-traceable full explanation; require explicit approval before separately authorized implementation. When implementation is authorized, synchronize the component folder, machine-readable contract manifest, authoritative colocated Markdown, concise registry, routed live documentation, tests, and rendered evidence; run the explanation validator, release-validator self-test, target release validator, and visual gate, and do not claim available until the release record passes."
