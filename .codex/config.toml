model_reasoning_summary = "detailed"
hide_agent_reasoning = false
show_raw_agent_reasoning = false
model_verbosity = "medium"
project_doc_max_bytes = 65536

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "powershell -NoProfile -ExecutionPolicy Bypass -Command \"& (Join-Path (git rev-parse --show-toplevel) '.codex/hooks/pm-rules.ps1')\""
timeout = 5
statusMessage = "Codex PM rules loaded"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 5
statusMessage = "Checking browser session ownership"

[[hooks.PostToolUse]]
matcher = "^Bash$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 5

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 30
statusMessage = "Closing owned browser sessions"

[[hooks.SubagentStop]]

[[hooks.SubagentStop.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 30

[[hooks.SessionStart]]
matcher = "startup|resume"

[[hooks.SessionStart.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 30
statusMessage = "Checking expired browser sessions"

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "node \"$(git rev-parse --show-toplevel)/scripts/agent-harness/browser-session-guard.mjs\""
timeout = 3

[features]
multi_agent = true

[agents.implementation_reviewer]
description = "Read-only, high-rigor reviewer for frontend/backend contracts, state lifecycles, regressions, tests, and plan fidelity."

[agents.harness_auditor]
description = "Read-only auditor for coding-agent instructions, memory, hooks, skills, provider prompts, evidence capture, and deterministic evaluations."
