<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>QBO Design System moved to /docs</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: #0a0a0f; color: #e4e4e8; }
    main { width: min(560px, 100%); padding: 28px; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; background: #1a1e2a; }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 40px); letter-spacing: -.035em; line-height: 1.06; }
    p { margin: 14px 0 0; color: #a1a1b3; line-height: 1.6; }
    a { display: inline-flex; min-height: 40px; margin-top: 22px; padding: 0 14px; border-radius: 7px; align-items: center; background: #6ea1f7; color: #07101f; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 2px solid #8bb7ff; outline-offset: 3px; }
    code { color: #b8d0fb; }
  </style>
</head>
<body>
  <main>
    <h1>The design system now lives inside the app.</h1>
    <p>The old standalone handbook has been retired. Start the QBO Escalations client and open <code>/docs</code> for the routed component library, detailed guidance, search, and live production specimens.</p>
    <a href="/docs">Open the design system</a>
  </main>
  <script>
    if (window.location.protocol !== 'file:') window.location.replace('/docs');
  </script>
</body>
</html>
